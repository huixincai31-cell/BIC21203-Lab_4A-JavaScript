<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Number Validator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
        }

        input {
            padding: 10px;
            width: 200px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #result {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>

    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">
        <h2>Smart Number Validator</h2>

        <label for="userInput">Enter a number:</label>
        <br>

        <input
            type="text"
            id="userInput"
            placeholder="Enter a number"
        >

        <button id="checkBtn" type="button">Check</button>

        <p id="result" role="status" aria-live="polite"></p>
    </div>

</body>
</html>
