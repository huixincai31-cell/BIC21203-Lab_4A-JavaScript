<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Number Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
        }

        button {
            padding: 10px 20px;
            background-color: #6f42c1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #563399;
        }

        ol {
            text-align: left;
            display: inline-block;
            margin-top: 20px;
        }

        li {
            padding: 5px;
        }
    </style>

    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">
        <h2>Dynamic Number Generator</h2>

        <button id="generateBtn" type="button">
            Generate
        </button>

        <ol id="numberList" aria-live="polite"></ol>
    </div>

</body>
</html>
